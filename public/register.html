<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>注册 · LouFung 论坛</title>
<link rel="stylesheet" href="/style.css?v=121">
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
<script>
(function(){
  var t = localStorage.getItem('forum-theme') || 'light';
  document.documentElement.setAttribute('data-theme', t);
})();
</script>
</head>
<body>
<div class="hero-orb"></div>
<div class="hero-orb-2"></div>

<nav class="nav">
  <a href="/" class="brand">LouFung 论坛</a>
  <a href="/login.html">登录</a>
</nav>

<div class="container narrow">
  <div class="card">
    <h1>注册</h1>
    <p class="sub">创建你的账号</p>
    <div class="error" id="err"></div>
    <div class="form-group">
      <label>用户名</label>
      <input id="username" type="text" placeholder="2-20 字" autocomplete="username">
    </div>
    <div class="form-group">
      <label>密码</label>
      <div class="pwd-wrap">
        <input id="password" type="password" placeholder="至少 6 位" autocomplete="new-password">
        <button type="button" class="pwd-eye" onclick="togglePwd('password', this)" aria-label="显示密码">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>
    </div>
    <div class="cf-turnstile" data-sitekey="0x4AAAAAAFYK6X4yFso3KTUj" data-theme="light" style="margin-bottom:18px"></div>
    <button class="btn" id="submitBtn" onclick="doRegister()">注册</button>
    <div class="center">已有账号？<a class="link" href="/login.html">去登录</a></div>
  </div>
</div>
<script>
function toggleTheme() {
  const cur = document.documentElement.getAttribute('data-theme') || 'light';
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('forum-theme', next);
  document.getElementById('themeBtn').textContent = next === 'dark' ? '☀️' : '🌙';
}

function togglePwd(id, btn) {
  const inp = document.getElementById(id);
  const show = inp.type === 'password';
  inp.type = show ? 'text' : 'password';
  btn.innerHTML = show
    ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>'
    : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
  btn.setAttribute('aria-label', show ? '隐藏密码' : '显示密码');
}

async function doRegister() {
  const btn = document.getElementById('submitBtn');
  const err = document.getElementById('err');
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  err.textContent = '';
  const tsToken = document.querySelector('[name="cf-turnstile-response"]')?.value || '';
  if (!tsToken) { err.textContent = '请先完成人机验证'; return; }
  if (username.length < 2) { err.textContent = '用户名至少 2 字'; return; }
  if (password.length < 6) { err.textContent = '密码至少 6 位'; return; }
  btn.disabled = true; btn.textContent = '注册中...';
  try {
    const r = await fetch('/api/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password, turnstile: tsToken })
    });
    const d = await r.json();
    if (d.ok) {
      alert('注册成功，请登录');
      location.href = '/login.html';
    } else {
      err.textContent = d.error || '注册失败';
      if (window.turnstile) turnstile.reset();
    }
  } catch (e) {
    err.textContent = '网络错误';
  } finally {
    btn.disabled = false; btn.textContent = '注册';
  }
}
</script>
</body>
</html>
