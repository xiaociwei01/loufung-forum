<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>帖子 · LouFung 论坛</title>
<link rel="stylesheet" href="/style.css?v=2">
<script>
(function(){
  var t = localStorage.getItem('forum-theme') || 'light';
  document.documentElement.setAttribute('data-theme', t);
})();
</script>
</head>
<body>
<div class="scroll-progress" id="scrollProgress"></div>
<div class="hero-orb"></div>
<div class="hero-orb-2"></div>

<nav class="nav">
  <a href="/" class="brand">LouFung 论坛</a>
  <span id="nav-right"></span>
  <button class="theme-btn" id="themeBtn" onclick="toggleTheme()" aria-label="切换主题">🌙</button>
</nav>

<div class="container">
  <div class="card" style="margin-bottom:20px">
    <h1 id="title" style="font-size:24px">加载中...</h1>
    <div class="meta" id="meta" style="margin-top:8px"></div>
    <div id="content" style="white-space:pre-wrap;line-height:1.8;margin-top:18px"></div>
  </div>
  <div class="card">
    <h2>评论</h2>
    <div id="comments" style="margin-top:16px"></div>
    <div id="commentForm" style="margin-top:24px;display:none">
      <div class="error" id="cerr"></div>
      <div class="form-group">
        <textarea id="ccontent" rows="3" placeholder="写评论（提交后需审核）"></textarea>
      </div>
      <button class="btn small" id="cbtn" onclick="doComment()">发评论</button>
    </div>
    <div id="cLoginTip" style="display:none;font-size:13px;color:var(--text-muted);margin-top:16px">
      请 <a class="link" href="/login.html">登录</a> 后评论
    </div>
  </div>
</div>
<script>
function toggleTheme() {
  const cur = document.documentElement.getAttribute('data-theme') || 'light';
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('forum-theme', next);
  document.getElementById('themeBtn').textContent = next === 'dark' ? '☀️' : '🌙';
}
(function(){
  const t = document.documentElement.getAttribute('data-theme');
  document.getElementById('themeBtn').textContent = t === 'dark' ? '☀️' : '🌙';
})();

window.addEventListener('scroll', () => {
  const h = document.documentElement.scrollHeight - window.innerHeight;
  const p = h > 0 ? (window.scrollY / h) * 100 : 0;
  document.getElementById('scrollProgress').style.width = p + '%';
}, { passive: true });

function esc(s) {
  return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}

const postId = new URLSearchParams(location.search).get('id');
let me = null;

async function loadPost() {
  if (!postId) { document.getElementById('title').textContent = '缺少帖子 ID'; return; }
  try {
    const r = await fetch('/api/posts/' + postId);
    const d = await r.json();
    if (!d.post) { document.getElementById('title').textContent = '帖子不存在'; return; }
    document.title = d.post.title + ' · LouFung 论坛';
    document.getElementById('title').textContent = d.post.title;
    document.getElementById('meta').textContent = d.post.username + ' · ' + d.post.created_at;
    document.getElementById('content').textContent = d.post.content;
    renderComments(d.comments);
  } catch (e) {
    document.getElementById('title').textContent = '加载失败';
  }
}

function renderComments(list) {
  const box = document.getElementById('comments');
  if (!list || list.length === 0) {
    box.innerHTML = '<div style="color:var(--text-muted);font-size:13px">还没有评论</div>';
    return;
  }
  box.innerHTML = list.map(c =>
    '<div style="padding:14px 0;border-top:1px solid var(--card-border)">' +
      '<div class="meta" style="margin-bottom:6px">' + esc(c.username) + ' · ' + c.created_at + '</div>' +
      '<div style="white-space:pre-wrap">' + esc(c.content) + '</div>' +
    '</div>'
  ).join('');
}

async function doComment() {
  const btn = document.getElementById('cbtn');
  const err = document.getElementById('cerr');
  const content = document.getElementById('ccontent').value.trim();
  err.textContent = '';
  if (!content) { err.textContent = '内容不能为空'; return; }
  btn.disabled = true; btn.textContent = '提交中...';
  try {
    const r = await fetch('/api/comments', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ post_id: Number(postId), content })
    });
    const d = await r.json();
    if (d.ok) {
      document.getElementById('ccontent').value = '';
      err.style.color = 'var(--accent)';
      err.textContent = '已提交，等待审核';
    } else {
      err.style.color = '#e5484d';
      err.textContent = d.error || '提交失败';
    }
  } catch (e) {
    err.style.color = '#e5484d';
    err.textContent = '网络错误';
  } finally { btn.disabled = false; btn.textContent = '发评论'; }
}

async function init() {
  me = await fetch('/api/me').then(r => r.json()).catch(() => ({ user: null }));
  const nav = document.getElementById('nav-right');
  if (me.user) {
    nav.innerHTML = '<span style="font-size:13px;color:var(--text-muted)">' + esc(me.user.username) + '</span>';
    document.getElementById('commentForm').style.display = 'block';
  } else {
    nav.innerHTML = '<a href="/login.html">登录</a>';
    document.getElementById('cLoginTip').style.display = 'block';
  }
  await loadPost();
}

init();
</script>
</body>
</html>
