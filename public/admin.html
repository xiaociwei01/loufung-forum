<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta name="view-transition" content="same-origin" />
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>管理后台 · LouFung 论坛</title>
<link rel="stylesheet" href="/style.css?v=1792460721">
<script>
(function(){
  var t = localStorage.getItem('forum-theme') || 'light';
  document.documentElement.setAttribute('data-theme', t);
})();
</script>
<style>
  .admin-tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 24px;
    overflow-x: auto;
    padding-bottom: 4px;
  }
  .admin-tab {
    padding: 8px 16px;
    border-radius: 999px;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    color: var(--text-muted);
    font-size: 14px;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.2s;
  }
  .admin-tab.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }
  .admin-list-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 0;
    border-bottom: 1px solid var(--card-border);
  }
  .admin-list-item:last-child { border-bottom: none; }
  .admin-list-info { flex: 1; min-width: 0; }
  .admin-list-title { font-weight: 600; font-size: 14px; color: var(--text-primary); margin-bottom: 4px; }
  .admin-list-meta { font-size: 12px; color: var(--text-muted); }
  .admin-action-btn {
    font-size: 12px; padding: 4px 10px; border-radius: 6px; cursor: pointer;
    border: 1px solid var(--card-border); background: transparent; color: #e5484d;
    transition: all 0.2s;
  }
  .admin-action-btn:hover { background: rgba(229,72,77,0.1); border-color: #e5484d; }
  .admin-action-btn.ban { color: #f59e0b; }
  .admin-action-btn.ban:hover { background: rgba(245,158,11,0.1); border-color: #f59e0b; }
textarea { resize: none !important; }
</style>
</head>
<body>
<div class="hero-orb"></div>
<div class="hero-orb-2"></div>

<header class="forum-header" style="position: fixed !important; top: 16px !important; left: 50% !important; transform: translateX(-50%) !important; width: calc(100% - 32px) !important; max-width: 880px !important; display: flex !important; flex-direction: row !important; align-items: center !important; justify-content: space-between !important; padding: 12px 24px !important; border-radius: 999px !important; background: rgba(255, 255, 255, 0.15) !important; backdrop-filter: blur(24px) saturate(180%) !important; -webkit-backdrop-filter: blur(24px) saturate(180%) !important; border: 1px solid rgba(255, 255, 255, 0.4) !important; box-shadow: 0 4px 24px rgba(0, 0, 0, 0.04), inset 0 1px 0 rgba(255, 255, 255, 0.8) !important; z-index: 1000 !important; box-sizing: border-box !important; margin: 0 !important;">
  
  <a href="/" class="logo" style="font-size: 15px !important; font-weight: 600 !important; color: #0a0a0a !important; text-decoration: none !important; text-shadow: 0 0 2px #fff, 0 0 6px #fff !important;">
     Lou<span style="color: #4d6bfe !important;">Fung</span> 论坛
  </a>

  <!-- 只留这一个空 div，让 JS 自己往里塞搜索和头像 -->
  <div id="nav-right" style="display: flex !important; align-items: center !important; gap: 12px !important;"></div>
</header>

<div class="container">
  <div id="statsBar" class="card" style="display:flex;justify-content:space-around;text-align:center;margin-bottom:24px;padding:16px;">
    <div><div style="font-size:20px;font-weight:bold;" id="statUsers">-</div><div class="admin-list-meta">用户</div></div>
    <div><div style="font-size:20px;font-weight:bold;" id="statPosts">-</div><div class="admin-list-meta">帖子</div></div>
    <div><div style="font-size:20px;font-weight:bold;" id="statComments">-</div><div class="admin-list-meta">评论</div></div>
  </div>

  <div class="admin-tabs">
    <div class="admin-tab active" onclick="switchTab('users', this)">用户管理</div>
    <div class="admin-tab" onclick="switchTab('posts', this)">帖子管理</div>
    <div class="admin-tab" onclick="switchTab('comments', this)">评论管理</div>
    <div class="admin-tab" onclick="switchTab('site', this)">主站控制</div><div class="admin-tab" onclick="switchTab('ai-config', this)">小c参数</div><div class="admin-tab" onclick="switchTab('ciwei', this)">小c控制</div>
  </div>

  <div class="card" style="padding:20px;">
    <div id="adminList">
      <div style="text-align:center;color:var(--text-muted);padding:20px;">加载中...</div>
    </div>
  </div>
</div>
<script>
let meUser = null;

function esc(s) {
  return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}

async function init() {
  // 1. 检查权限
  const me = await fetch('/api/me').then(r => r.json()).catch(() => ({ user: null }));
  if (!me.user) { location.href = '/login.html'; return; }
  
  // 判断是否 admin (后端会拦截请求，但我们也可以在前端先预判)
  // 这里我们直接尝试获取 stats，如果 403 就跳走
  const res = await fetch('/api/admin/stats');
  if (res.status === 403) {
    alert('无管理员权限');
    location.href = '/';
    return;
  }
  const stats = await res.json();
  
  // 2. 渲染顶栏
  const nav = document.getElementById('nav-right');
  nav.innerHTML = '<a href="/" style="font-size:14px;color:var(--accent);text-decoration:none;">返回首页</a>';

  // 3. 填充数据
  document.getElementById('statUsers').textContent = stats.userCount;
  document.getElementById('statPosts').textContent = stats.postCount;
  document.getElementById('statComments').textContent = stats.commentCount;
  
  // 默认加载用户列表
  loadTab('users');
}

function switchTab(type, el) {
  document.querySelectorAll('.admin-tab').forEach(t => t.classList.remove('active'));
  if (el) el.classList.add('active');
  loadTab(type);
}

let currentTab = 'users';

async function loadTab(type) {
  currentTab = type;
  const box = document.getElementById('adminList');
  box.innerHTML = '<div style="text-align:center;color:var(--text-muted);padding:20px;">加载中...</div>';
  
  if (type === 'ciwei') {
    box.innerHTML = '加载中...';
    fetch('https://c.loufung.cn/api/settings').then(r=>r.json()).then(cfg => {
      const model = cfg.model || 'deepseek-v4-flash';
      const temp = cfg.temperature || '0.7';
      let html = '<div class="form-group"><label>模型</label><select id="ciweiModel" style="width:100%;padding:10px;border-radius:8px;border:1px solid var(--card-border);">';
      html += '<option value="deepseek-v4-flash" ' + (model === 'deepseek-v4-flash' ? 'selected' : '') + '>Flash (快速)</option>';
      html += '<option value="deepseek-v4-pro" ' + (model === 'deepseek-v4-pro' ? 'selected' : '') + '>Pro (推理)</option></select></div>';
      
      html += '<div class="form-group"><label>温度 <span id="vTemp">' + temp + '</span></label>';
      html += '<input type="range" id="ciweiTemp" min="0.1" max="1.5" step="0.1" value="' + temp + '" style="width:100%;" oninput="document.getElementById(\'vTemp\').innerText=this.value"></div>';
      
      html += '<div class="form-group"><label>提示词</label><textarea id="ciweiPrompt" rows="4" style="width:100%;padding:10px;border-radius:8px;border:1px solid var(--card-border);">' + (cfg.system_prompt || '') + '</textarea></div>';
      
      html += '<div class="form-group"><label>快捷对话卡片</label><div id="dCardList"></div>';
      html += '<button class="btn small ghost" style="width:100%;margin-top:10px;" onclick="addDCard()">+ 添加对话</button></div>';
      html += '<button class="btn" style="margin-top:20px;" onclick="saveCiweiConfig()">保存并同步</button>';
      
      box.innerHTML = html;
      
      try {
        const ds = JSON.parse(cfg.dialogues || '[]');
        ds.forEach(d => {
          const div = document.createElement('div');
          div.className = 'd-row';
          div.style.cssText = 'border:1px solid var(--card-border);padding:12px;margin-bottom:12px;border-radius:8px;background:var(--bg-body);';
          div.innerHTML = '<div style="display:flex;justify-content:space-between;margin-bottom:8px;"><strong>对话</strong><button onclick="this.parentNode.parentNode.remove()" style="background:none;border:none;color:red;">删除</button></div>' +
            '<input type="text" class="d-icon" value="' + (d.icon||'') + '" placeholder="图标" style="width:100%;margin-bottom:6px;padding:8px;border:1px solid #ddd;border-radius:4px;">' +
            '<input type="text" class="d-q" value="' + (d.q||'') + '" placeholder="问题" style="width:100%;margin-bottom:6px;padding:8px;border:1px solid #ddd;border-radius:4px;">' +
            '<textarea class="d-a" placeholder="回答" rows="2" style="width:100%;padding:8px;border:1px solid #ddd;border-radius:4px;">' + (d.a||'') + '</textarea>';
          document.getElementById('dCardList').appendChild(div);
        });
      } catch(e) {}
    });
    return;
  }

  
  if (type === 'ai-config') {
    box.innerHTML = '加载中...';
    fetch('/api/admin/ciwei-config').then(r => r.json()).then(cfg => {
      // 容错处理
      cfg = cfg || {};
      const model = cfg.model || 'deepseek-v4-flash';
      const temp = cfg.temperature || 0.7;
      const maxTok = cfg.maxTokens || 1024;
      const ctx = cfg.contextLines || 10;
      const effort = cfg.reasoningEffort || 'high';
      const stream = cfg.stream !== false;

      box.innerHTML = `
  <div class="form-group">
    <label>DeepSeek API Key (必填)</label>
    <input type="password" id="cApiKey" value="${cfg.apiKey || ''}" placeholder="sk-..." style="width:100%;padding:10px;border-radius:8px;border:1px solid var(--card-border);background:var(--bg-body);color:var(--text-primary);margin-top:6px;">
  </div>

  <div class="form-group" style="margin-top:16px;">
    <label>模型 (Model)</label>
          <select id="cModel" style="width:100%;padding:10px;border-radius:8px;border:1px solid var(--card-border);background:var(--bg-body);color:var(--text-primary);">
            <option value="deepseek-v4-flash" ${model === 'deepseek-v4-flash' ? 'selected' : ''}>Flash · 快速 (便宜)</option>
            <option value="deepseek-v4-pro" ${model === 'deepseek-v4-pro' ? 'selected' : ''}>Pro · 推理 (更强)</option>
          </select>
        </div>
        
        <div class="form-group" style="margin-top:16px;">
          <div style="display:flex;justify-content:space-between;">
            <label>温度 (Temperature)</label>
            <span id="valTemp" style="font-weight:bold;">${temp}</span>
          </div>
          <input type="range" id="cTemp" min="0.1" max="1.5" step="0.1" value="${temp}" style="width:100%;margin-top:8px;accent-color:var(--accent);" oninput="document.getElementById('valTemp').innerText=this.value">
        </div>

        <div class="form-group" style="margin-top:16px;">
          <div style="display:flex;justify-content:space-between;">
            <label>最大输出 Tokens</label>
            <span id="valMax" style="font-weight:bold;">${maxTok}</span>
          </div>
          <input type="range" id="cMax" min="256" max="4096" step="256" value="${maxTok}" style="width:100%;margin-top:8px;accent-color:var(--accent);" oninput="document.getElementById('valMax').innerText=this.value">
        </div>

        <div class="form-group" style="margin-top:16px;">
          <label>推理强度</label>
          <select id="cEffort" style="width:100%;padding:10px;border-radius:8px;border:1px solid var(--card-border);background:var(--bg-body);color:var(--text-primary);">
            <option value="low" ${effort === 'low' ? 'selected' : ''}>低</option>
            <option value="high" ${effort === 'high' ? 'selected' : ''}>高</option>
            <option value="max" ${effort === 'max' ? 'selected' : ''}>最大</option>
          </select>
        </div>

        <div class="form-group" style="margin-top:16px;">
          <label>流式输出 (打字机效果)</label>
          <select id="cStream" style="width:100%;padding:10px;border-radius:8px;border:1px solid var(--card-border);background:var(--bg-body);color:var(--text-primary);">
            <option value="true" ${stream ? 'selected' : ''}>开启</option>
            <option value="false" ${!stream ? 'selected' : ''}>关闭</option>
          </select>
        </div>

        <button class="btn" style="margin-top:24px;" onclick="saveAiConfig()">保存到服务器</button>
      `;
    }).catch(e => box.innerHTML = '读取失败');
    return;
  }

  if (type === 'site') {
    box.innerHTML = '加载中...';
    try {
      const r = await fetch('https://loufung.cn/api/config');
      const cfg = await r.json();
      
      const cardsHtml = (cfg.cards || []).map((c, i) => `
        <div style="border:1px solid var(--card-border); padding:12px; border-radius:8px; margin-bottom:12px; background:var(--bg-body);">
          <div style="display:flex; justify-content:space-between; margin-bottom:8px;">
            
            <label style="font-size:12px; display:flex; align-items:center; gap:4px; margin-right: 10px;">
              <input type="checkbox" class="c-visible" ${c.visible !== false ? 'checked' : ''}> 显示
            </label>
            <strong style="font-size:13px;">卡片 ${i+1}</strong>
            <button onclick="this.parentNode.parentNode.remove()" style="background:none;border:none;color:#e5484d;cursor:pointer;font-size:12px;">删除</button>
          </div>
          <input type="text" class="c-cat" value="${esc(c.category||'')}" placeholder="分类 (如: AI · 桌宠)" style="width:100%; padding:6px; margin-bottom:6px; border:1px solid var(--card-border); border-radius:4px; background:var(--card-bg); color:var(--text-primary);">
          <input type="text" class="c-name" value="${esc(c.name||'')}" placeholder="标题 (如: 小c)" style="width:100%; padding:6px; margin-bottom:6px; border:1px solid var(--card-border); border-radius:4px; background:var(--card-bg); color:var(--text-primary);">
          <input type="text" class="c-desc" value="${esc(c.desc||'')}" placeholder="描述" style="width:100%; padding:6px; margin-bottom:6px; border:1px solid var(--card-border); border-radius:4px; background:var(--card-bg); color:var(--text-primary);">
          <input type="text" class="c-link" value="${esc(c.link||'')}" placeholder="跳转链接 (如: https://...)" style="width:100%; padding:6px; margin-bottom:6px; border:1px solid var(--card-border); border-radius:4px; background:var(--card-bg); color:var(--text-primary);">
          <input type="text" class="c-byline" value="${esc(c.byline||'')}" placeholder="附加提示 (可留空，如: 💡 由 xx 建议)" style="width:100%; padding:6px; border:1px solid var(--card-border); border-radius:4px; background:var(--card-bg); color:var(--text-primary);">
        </div>
      `).join('');

      const statsHtml = (cfg.stats || []).map((s, i) => `
        <div style="display:flex; gap:8px; margin-bottom:8px;" class="stat-row">
          <input type="text" class="s-num" value="${esc(s.num||'')}" placeholder="数字 (如: 3)" style="flex:1; padding:6px; border:1px solid var(--card-border); border-radius:4px; background:var(--bg-body); color:var(--text-primary);">
          <input type="text" class="s-label" value="${esc(s.label||'')}" placeholder="标签 (如: 作品)" style="flex:1; padding:6px; border:1px solid var(--card-border); border-radius:4px; background:var(--bg-body); color:var(--text-primary);">
        </div>
      `).join('');

      
      

      box.innerHTML = `
        <div style="padding: 10px 0;">
          <div class="form-group" style="margin-bottom:16px; background:rgba(77,107,254,0.05); padding:12px; border-radius:8px;">
            <label style="display:flex; align-items:center; gap:8px; font-weight:bold;">
              <input type="checkbox" id="cfgPublic" ${cfg.publicEnabled !== false ? 'checked' : ''} style="width:18px;height:18px;"> 
              开启对外访问 (关闭后仅限局域网)
            </label>
          </div>
          <div class="form-group">
            <label>关于 (支持直接回车换行，支持 **加粗**)</label>
            <textarea id="cfgAbout" rows="2" style="width:100%;padding:10px;border-radius:8px;border:1px solid var(--card-border);background:var(--bg-body);color:var(--text-primary);margin-top:6px;">${esc(cfg.about || '')}</textarea>
          </div>
          
            <button class="btn small ghost" onclick="addStat()" style="margin-top:8px;">+ 添加统计</button>
          </div>
          <div class="form-group" style="margin-top:16px;">
            <label>公告 (Notice)</label>
            <textarea id="cfgNotice" rows="2" style="width:100%;padding:10px;border-radius:8px;border:1px solid var(--card-border);background:var(--bg-body);color:var(--text-primary);margin-top:6px;">${esc(cfg.notice || '')}</textarea>
          </div>
          <div class="form-group" style="margin-top:20px;">
            <label>项目卡片列表</label>
            <div id="cardsContainer">${cardsHtml}</div>
            <button class="btn small ghost" onclick="addCard()" style="margin-top:8px;">+ 添加卡片</button>
          </div>
          <button class="btn" style="margin-top:24px;" onclick="saveSiteConfig()">保存并同步到主站</button>
        </div>
      `;
    } catch (e) {
      box.innerHTML = '<div style="text-align:center;color:#e5484d;padding:20px;">读取失败: ' + e.message + '</div>';
    }
    return;
  }

  try {
    const r = await fetch('/api/admin/' + type);
    if (!r.ok) throw new Error('权限不足或网络错误');
    const d = await r.json();
    
    if (type === 'users') {
      box.innerHTML = d.users.map(u => `
        <div class="admin-list-item">
          <div class="admin-list-info">
            <div class="admin-list-title">${esc(u.username)} ${u.role === 'admin' ? '<span style="font-size:10px;color:#4d6bfe;background:rgba(77,107,254,0.1);padding:2px 6px;border-radius:4px;">管理员</span>' : ''} ${u.role === 'banned' ? '<span style="font-size:10px;color:#e5484d;background:rgba(229,72,77,0.1);padding:2px 6px;border-radius:4px;">已封禁</span>' : ''}</div>
            <div class="admin-list-meta">UID: ${u.id} · 注册于 ${u.created_at}</div>
          </div>
          ${u.role === 'admin' ? '' : `<button class="admin-action-btn ban" onclick="doBanUser(${u.id}, '${u.role}')">${u.role === 'banned' ? '解封' : '封禁'}</button>`}
        </div>
      `).join('') || '<div style="text-align:center;color:var(--text-muted);padding:20px;">没有用户</div>';
      
    } else if (type === 'posts') {
      box.innerHTML = d.posts.map(p => `
        <div class="admin-list-item">
          <div class="admin-list-info">
            <div class="admin-list-title">${esc(p.title)}</div>
            <div class="admin-list-meta">${esc(p.username)} · ${p.created_at}</div>
          </div>
          <button class="admin-action-btn" onclick="doDeletePost(${p.id})">删除</button>
        </div>
      `).join('') || '<div style="text-align:center;color:var(--text-muted);padding:20px;">没有帖子</div>';
      
    } else if (type === 'comments') {
      box.innerHTML = d.comments.map(c => `
        <div class="admin-list-item">
          <div class="admin-list-info">
            <div class="admin-list-title" style="font-weight:normal;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(c.content)}</div>
            <div class="admin-list-meta">${esc(c.username)} · ${c.created_at}</div>
          </div>
          <button class="admin-action-btn" onclick="doDeleteComment(${c.id})">删除</button>
        </div>
      `).join('') || '<div style="text-align:center;color:var(--text-muted);padding:20px;">没有评论</div>';
    }
  } catch (e) {
    box.innerHTML = '<div style="text-align:center;color:#e5484d;padding:20px;">' + e.message + '</div>';
  }
}

async function updateStats() {
  const res = await fetch('/api/admin/stats');
  if (res.ok) {
    const stats = await res.json();
    document.getElementById('statUsers').textContent = stats.userCount;
    document.getElementById('statPosts').textContent = stats.postCount;
    document.getElementById('statComments').textContent = stats.commentCount;
  }
}

async function doDeletePost(id) {
  if (!confirm('确定删除这篇帖子及其所有评论？')) return;
  const r = await fetch('/api/admin/posts/' + id, { method: 'DELETE' });
  if (r.ok) { loadTab('posts'); updateStats(); }
  else { alert('删除失败'); }
}

async function doDeleteComment(id) {
  if (!confirm('确定删除这条评论？')) return;
  const r = await fetch('/api/admin/comments/' + id, { method: 'DELETE' });
  if (r.ok) { loadTab('comments'); updateStats(); }
  else { alert('删除失败'); }
}

async function doBanUser(id, role) {
  const isBanned = role === 'banned';
  if (!confirm(isBanned ? '确定解封该用户？' : '确定封禁该用户？')) return;
  const r = await fetch('/api/admin/users/' + id + '/ban', { method: 'POST' });
  const d = await r.json();
  if (r.ok) { loadTab('users'); } 
  else { alert(d.error || '操作失败'); }
}



function addStat() {
  const div = document.createElement('div');
  div.className = 'stat-row';
  div.style.cssText = 'display:flex; gap:8px; margin-bottom:8px;';
  div.innerHTML = `<input type="text" class="s-num" placeholder="数字" style="flex:1; padding:6px; border:1px solid var(--card-border); border-radius:4px; background:var(--bg-body);"><input type="text" class="s-label" placeholder="标签" style="flex:1; padding:6px; border:1px solid var(--card-border); border-radius:4px; background:var(--bg-body);">`;
  document.getElementById('statsContainer').appendChild(div);
}

function addCard() {
  const container = document.getElementById('cardsContainer');
  const div = document.createElement('div');
  div.style.cssText = 'border:1px solid var(--card-border); padding:12px; border-radius:8px; margin-bottom:12px; background:var(--bg-body);';
  div.innerHTML = `
    <div style="display:flex; justify-content:space-between; margin-bottom:8px;">
      
      <label style="font-size:12px; display:flex; align-items:center; gap:4px; margin-right: 10px;">
        <input type="checkbox" class="c-visible" checked> 显示
      </label>
      <strong style="font-size:13px;">新卡片</strong>
      <button onclick="this.parentNode.parentNode.remove()" style="background:none;border:none;color:#e5484d;cursor:pointer;font-size:12px;">删除</button>
    </div>
    <input type="text" class="c-cat" placeholder="分类" style="width:100%; padding:6px; margin-bottom:6px; border:1px solid var(--card-border); border-radius:4px; background:var(--card-bg);">
    <input type="text" class="c-name" placeholder="标题" style="width:100%; padding:6px; margin-bottom:6px; border:1px solid var(--card-border); border-radius:4px; background:var(--card-bg);">
    <input type="text" class="c-desc" placeholder="描述" style="width:100%; padding:6px; margin-bottom:6px; border:1px solid var(--card-border); border-radius:4px; background:var(--card-bg);">
    <input type="text" class="c-link" placeholder="链接" style="width:100%; padding:6px; margin-bottom:6px; border:1px solid var(--card-border); border-radius:4px; background:var(--card-bg);">
    <input type="text" class="c-byline" placeholder="附加提示 (可留空)" style="width:100%; padding:6px; border:1px solid var(--card-border); border-radius:4px; background:var(--card-bg);">
  `;
  container.appendChild(div);
}

async function saveCiweiConfig() {
  const model = document.getElementById('ciweiModel').value;
  const temperature = document.getElementById('ciweiTemp').value;
  const system_prompt = document.getElementById('ciweiPrompt').value;
  const ds = Array.from(document.querySelectorAll('.d-row')).map(r => ({
    icon: r.querySelector('.d-icon').value,
    q: r.querySelector('.d-q').value,
    a: r.querySelector('.d-a').value
  }));
  await fetch('https://c.loufung.cn/api/settings', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ model, temperature, system_prompt, dialogues: JSON.stringify(ds) })
  });
  alert('✅ 小c配置已保存！');
}

function addDCard() {
  const div = document.createElement('div');
  div.className = 'd-row';
  div.style.cssText = 'border:1px solid var(--card-border);padding:12px;margin-bottom:12px;border-radius:8px;background:var(--bg-body);';
  div.innerHTML = '<div style="display:flex;justify-content:space-between;margin-bottom:8px;"><strong>新对话</strong><button onclick="this.parentNode.parentNode.remove()" style="background:none;border:none;color:red;">删除</button></div>' +
    '<input type="text" class="d-icon" placeholder="图标" style="width:100%;margin-bottom:6px;padding:8px;border:1px solid #ddd;border-radius:4px;">' +
    '<input type="text" class="d-q" placeholder="问题" style="width:100%;margin-bottom:6px;padding:8px;border:1px solid #ddd;border-radius:4px;">' +
    '<textarea class="d-a" placeholder="回答" rows="2" style="width:100%;padding:8px;border:1px solid #ddd;border-radius:4px;"></textarea>';

}


async function saveAiConfig() {
  const model = document.getElementById('cModel').value;
  const temperature = parseFloat(document.getElementById('cTemp').value);
  const maxTokens = parseInt(document.getElementById('cMax').value);
  const reasoningEffort = document.getElementById('cEffort').value;
  const stream = document.getElementById('cStream').value === 'true';
  const contextLines = 10; 
  const apiKey = document.getElementById('cApiKey').value; // ⭐ 获取Key

  try {
    const r = await fetch('/api/admin/ciwei-config', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ model, temperature, maxTokens, reasoningEffort, stream, contextLines, apiKey }) // ⭐ 发送Key
    });
    if (r.ok) alert('✅ 参数已保存，刷新小c页面即可生效！');
    else alert('保存失败');
  } catch(e) { alert('网络错误'); }
}

async function saveSiteConfig() {
  const btn = event.target;
  const oldText = btn.textContent;
  btn.disabled = true; btn.textContent = '保存中...';

  const cards = Array.from(document.querySelectorAll('#cardsContainer > div')).map(div => ({
    visible: div.querySelector('.c-visible').checked,
    category: div.querySelector('.c-cat').value,
    name: div.querySelector('.c-name').value,
    desc: div.querySelector('.c-desc').value,
    link: div.querySelector('.c-link').value,
    byline: div.querySelector('.c-byline').value
  }));

  const aboutText = document.getElementById('cfgAbout').value.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>').replace(/\n/g, '<br>');
  const noticeText = document.getElementById('cfgNotice').value.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>').replace(/\n/g, '<br>');

  const payload = {
    publicEnabled: document.getElementById('cfgPublic').checked,
    about: aboutText,
    notice: noticeText,
    cards: cards
  };

  try {
    const r = await fetch('https://loufung.cn/api/admin/config', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer loufung-admin-secret'
      },
      body: JSON.stringify(payload)
    });
    if (!r.ok) throw new Error('HTTP状态码 ' + r.status);
    const text = await r.text();
    if (text === 'OK' || text.includes('success')) alert('✅ 主站配置已同步更新！');
    else alert('更新失败: ' + text);
  } catch (e) {
    alert('网络请求失败: ' + e.message);
  } finally {
    btn.disabled = false; btn.textContent = oldText;
  }
}

init();
</script>
