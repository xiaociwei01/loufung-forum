<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 · LouFung 论坛</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<nav class="nav">
  <a href="/" class="brand">LouFung 论坛</a>
  <a href="/register.html">注册</a>
</nav>
<div class="container" style="max-width:420px">
  <div class="card">
    <h1>登录</h1>
    <p class="sub">欢迎回来</p>
    <div class="error" id="err"></div>
    <div class="form-group">
      <label>用户名</label>
      <input id="username" type="text" autocomplete="username">
    </div>
    <div class="form-group">
      <label>密码</label>
      <input id="password" type="password" autocomplete="current-password">
    </div>
    <button class="btn" id="submitBtn" onclick="doLogin()">登录</button>
    <div class="center">还没有账号？<a class="link" href="/register.html">去注册</a></div>
  </div>
</div>
<script>
async function doLogin() {
  const btn = document.getElementById('submitBtn');
  const err = document.getElementById('err');
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  err.textContent = '';
  if (!username || !password) { err.textContent = '请填写用户名和密码'; return; }
  btn.disabled = true; btn.textContent = '登录中...';
  try {
    const r = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    const d = await r.json();
    if (d.ok) { location.href = '/'; }
    else { err.textContent = d.error || '登录失败'; }
  } catch (e) {
    err.textContent = '网络错误';
  } finally {
    btn.disabled = false; btn.textContent = '登录';
  }
}
document.getElementById('password').addEventListener('keydown', e => {
  if (e.key === 'Enter') doLogin();
});
</script>
</body>
</html>
