<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>登录 · LouFung 论坛</title>
<link rel="stylesheet" href="/style.css?v=2">
<script>
(function(){
  var t = localStorage.getItem('forum-theme') || 'light';
  document.documentElement.setAttribute('data-theme', t);
})();
</script>
</head>
<body>
<div class="scroll-progress" id="scrollProgress"></div>
<div class="hero-orb"></div>
<div class="hero-orb-2"></div>

<nav class="nav">
  <a href="/" class="brand">LouFung 论坛</a>
  <a href="/register.html">注册</a>
  <button class="theme-btn" id="themeBtn" onclick="toggleTheme()" aria-label="切换主题">🌙</button>
</nav>

<div class="container narrow">
  <div class="card">
    <h1>登录</h1>
    <p class="sub">欢迎回来</p>
    <div class="error" id="err"></div>
    <div class="form-group">
      <label>用户名</label>
      <input id="username" type="text" autocomplete="username">
    </div>
    <div class="form-group">
      <label>密码</label>
      <div class="pwd-wrap">
        <input id="password" type="password" autocomplete="current-password">
        <button type="button" class="pwd-eye" onclick="togglePwd('password', this)" aria-label="显示密码">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>
    </div>
    <button class="btn" id="submitBtn" onclick="doLogin()">登录</button>
    <div class="center">还没有账号？<a class="link" href="/register.html">去注册</a></div>
  </div>
</div>
<script>
function toggleTheme() {
  const cur = document.documentElement.getAttribute('data-theme') || 'light';
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('forum-theme', next);
  document.getElementById('themeBtn').textContent = next === 'dark' ? '☀️' : '🌙';
}
(function(){
  const t = document.documentElement.getAttribute('data-theme');
  document.getElementById('themeBtn').textContent = t === 'dark' ? '☀️' : '🌙';
})();

window.addEventListener('scroll', () => {
  const h = document.documentElement.scrollHeight - window.innerHeight;
  const p = h > 0 ? (window.scrollY / h) * 100 : 0;
  document.getElementById('scrollProgress').style.width = p + '%';
}, { passive: true });

function togglePwd(id, btn) {
  const inp = document.getElementById(id);
  const show = inp.type === 'password';
  inp.type = show ? 'text' : 'password';
  btn.innerHTML = show
    ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>'
    : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
  btn.setAttribute('aria-label', show ? '隐藏密码' : '显示密码');
}

async function doLogin() {
  const btn = document.getElementById('submitBtn');
  const err = document.getElementById('err');
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  err.textContent = '';
  if (!username || !password) { err.textContent = '请填写用户名和密码'; return; }
  btn.disabled = true; btn.textContent = '登录中...';
  try {
    const r = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    const d = await r.json();
    if (d.ok) { location.href = '/'; }
    else { err.textContent = d.error || '登录失败'; }
  } catch (e) {
    err.textContent = '网络错误';
  } finally {
    btn.disabled = false; btn.textContent = '登录';
  }
}
document.getElementById('password').addEventListener('keydown', e => {
  if (e.key === 'Enter') doLogin();
});
</script>
</body>
</html>
