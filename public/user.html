<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta name="view-transition" content="same-origin" />
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>用户主页 · LouFung 论坛</title>
<link rel="stylesheet" href="/style.css?v=134">
<script>
(function(){
  var t = localStorage.getItem('forum-theme') || 'light';
  document.documentElement.setAttribute('data-theme', t);
})();
</script>
</head>
<body>
<div class="hero-orb"></div>
<div class="hero-orb-2"></div>

<header class="forum-header" style="position: fixed !important; top: 16px !important; left: 50% !important; transform: translateX(-50%) !important; width: calc(100% - 32px) !important; max-width: 880px !important; display: flex !important; flex-direction: row !important; align-items: center !important; justify-content: space-between !important; padding: 12px 24px !important; border-radius: 999px !important; background: rgba(255, 255, 255, 0.15) !important; backdrop-filter: blur(24px) saturate(180%) !important; -webkit-backdrop-filter: blur(24px) saturate(180%) !important; border: 1px solid rgba(255, 255, 255, 0.4) !important; box-shadow: 0 4px 24px rgba(0, 0, 0, 0.04), inset 0 1px 0 rgba(255, 255, 255, 0.8) !important; z-index: 1000 !important; box-sizing: border-box !important; margin: 0 !important;">
  
  <a href="/" class="logo" style="font-size: 15px !important; font-weight: 600 !important; color: #0a0a0a !important; text-decoration: none !important; text-shadow: 0 0 2px #fff, 0 0 6px #fff !important;">
     Lou<span style="color: #4d6bfe !important;">Fung</span> 论坛
  </a>

  <!-- 只留这一个空 div，让 JS 自己往里塞搜索和头像 -->
  <div id="nav-right" style="display: flex !important; align-items: center !important; gap: 12px !important;"></div>
</header>

<div class="container">
  <!-- 用户信息头部 -->
  <div class="card" style="margin-bottom:24px;padding:32px 24px;text-align:center;">
    <div id="userAvatar" style="width:80px;height:80px;font-size:32px;margin:0 auto 16px;box-shadow:0 8px 24px rgba(0,0,0,0.08);"></div>
    <h1 id="userName" style="font-size:24px;margin-bottom:4px;">加载中...</h1>
    <div id="userUid" style="font-size:12px;color:var(--text-muted);margin-bottom:12px;"></div>
    <div style="color:var(--text-muted);font-size:13px;margin-bottom:16px;" id="userMeta"></div>
    <div style="display:flex;justify-content:center;gap:32px;">
      <div><div style="font-size:18px;font-weight:700;" id="userPostCount">-</div><div style="font-size:12px;color:var(--text-muted)">发帖</div></div>
      <div><div style="font-size:18px;font-weight:700;" id="userJoinTime">-</div><div style="font-size:12px;color:var(--text-muted)">加入</div></div>
    </div>
  </div>

  <h2 style="font-size:18px;margin-bottom:16px;">TA 的帖子</h2>
  <div id="posts"></div>
</div>
<script>
let meUser = null;
let currentUser = null;

function esc(s) {
  return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}

function avatarHTML(name) {
  const colors = ['#4d6bfe','#f59e0b','#10b981','#ef4444','#8b5cf6','#ec4899','#06b6d4','#84cc16'];
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) >>> 0;
  return '<div class="avatar" style="background:' + colors[h % colors.length] + '">' + (name[0] || '?').toUpperCase() + '</div>';
}

async function init() {
  // 1. 检查登录状态
  const me = await fetch('/api/me').then(r => r.json()).catch(() => ({ user: null }));
  meUser = me.user;
  const nav = document.getElementById('nav-right');
  if (meUser) {
    nav.innerHTML = '<a href="/user.html?u=' + encodeURIComponent(meUser.username) + '" style="font-size:13px;color:var(--text-muted)">' + esc(meUser.username) + '</a> <a href="#" onclick="logout();return false" style="margin-left:12px">退出</a>';
  } else {
    nav.innerHTML = '<a href="/search.html" style="color:var(--text-muted);display:flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:50%;transition:background 0.2s;" onmouseover="this.style.background=\'var(--card-hover-bg)\'" onmouseout="this.style.background=\'transparent\'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></a><a href="/login.html" style="margin-left:8px">登录</a>';
  }

  // 2. 获取 URL 里的用户名
  const urlParams = new URLSearchParams(location.search);
  const username = urlParams.get('u');
  if (!username) {
    document.getElementById('userName').textContent = '缺少用户名参数';
    return;
  }

  // 3. 请求数据
  try {
    const r = await fetch('/api/users/' + encodeURIComponent(username));
    const d = await r.json();
    if (!r.ok) {
      document.getElementById('userName').textContent = d.error || '用户不存在';
      return;
    }
    currentUser = d.user;
    fillHeader(d.user, d.total);
    renderPosts(d.posts);
  } catch (e) {
    document.getElementById('userName').textContent = '网络错误';
  }
}

function fillHeader(user, total) {
  const avatarEl = document.getElementById('userAvatar');
  const colors = ['#4d6bfe','#f59e0b','#10b981','#ef4444','#8b5cf6','#ec4899','#06b6d4','#84cc16'];
  let h = 0;
  for (let i = 0; i < user.username.length; i++) h = (h * 31 + user.username.charCodeAt(i)) >>> 0;
  avatarEl.style.background = colors[h % colors.length];
  avatarEl.textContent = (user.username[0] || '?').toUpperCase();
  avatarEl.classList.add('avatar'); // 借用基础圆角样式
  avatarEl.style.cssText += 'width:80px;height:80px;font-size:32px;margin:0 auto 16px;box-shadow:0 8px 24px rgba(0,0,0,0.08);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:bold;';
  
  document.getElementById('userName').textContent = user.username;
  document.getElementById('userUid').textContent = 'UID: ' + user.id;
  document.getElementById('userPostCount').textContent = total || 0;
  
  // 截取日期（YYYY-MM-DD）
  const joinDate = (user.created_at || '').slice(0, 10);
  document.getElementById('userJoinTime').textContent = joinDate;
  
  if (meUser && meUser.username === user.username) {
    document.getElementById('userMeta').innerHTML = '<span class="me-badge">这是我</span>';
  } else {
    document.getElementById('userMeta').textContent = '社区成员';
  }
}

function renderPosts(posts) {
  const box = document.getElementById('posts');
  if (!posts || posts.length === 0) {
    box.innerHTML = '<div class="card" style="text-align:center;color:var(--text-muted)">TA 还没有发过帖子</div>';
    return;
  }
  
  box.innerHTML = posts.map(p => {
    const excerpt = (p.content || '').slice(0, 80) + ((p.content || '').length > 80 ? '…' : '');
    return `
      <div class="card reveal" style="margin-bottom:16px">
        <div class="post-head">
          <div class="author-row">
            ${avatarHTML(p.username || currentUser.username)}
            <span class="author-name">${esc(p.username || currentUser.username)}</span>
            <span class="author-time">${p.created_at}</span>
          </div>
          <a href="/post.html?id=${p.id}" style="text-decoration:none;color:inherit">
            <h2 class="post-title">${esc(p.title)}</h2>
          </a>
          <div class="post-excerpt">${esc(excerpt)}</div>
          <div class="post-actions">
            <span class="act"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M7 10v12"/><path d="M15 5.88 14 10h5.83a2 2 0 0 1 1.92 2.56l-2.33 8A2 2 0 0 1 17.5 22H4a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h2.76a2 2 0 0 0 1.79-1.11L12 2a3.13 3.13 0 0 1 3 3.88Z"/></svg><span>${p.like_count || 0}</span></span>
            <span class="act"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg><span>${p.comment_count || 0}</span></span>
            <span class="act"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg><span>${p.share_count || 0}</span></span>
          </div>
        </div>
      </div>
    `;
  }).join('');
  if (window.initReveal) window.initReveal();
}

async function logout() {
  await fetch('/api/logout', { method: 'POST' });
  location.href = '/';
}

init();
</script>

<div class="global-nav">
  <a href="/" class="">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    首页
  </a>
  <a href="/new.html" class=" add-btn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    发帖
  </a>
  <a href="/my" class="active">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    我的
  </a>
</div>


<script>
// 动态修复底栏的“我的”链接
(async function() {
  try {
    const r = await fetch('/api/me');
    const d = await r.json();
    const myLink = document.querySelector('.global-nav a[href="/my"]');
    if (myLink) {
      if (d.user) {
        myLink.href = '/user.html?u=' + encodeURIComponent(d.user.username);
        myLink.classList.add('active'); // 如果在用户主页可以高亮
      } else {
        myLink.href = '/login.html';
      }
    }
  } catch(e) {}
})();
</script>

<script src="/animations.js"></script>

<script id="glass-bottom-nav-script">
document.addEventListener("DOMContentLoaded", function() {
    const addBtn = document.querySelector('a[href="/new.html"].add-btn');
    if(addBtn && addBtn.parentElement) {
        const nav = addBtn.parentElement;
        const glassStyle = "position: fixed !important; bottom: 16px !important; left: 50% !important; transform: translateX(-50%) !important; width: calc(100% - 32px) !important; max-width: 880px !important; display: flex !important; flex-direction: row !important; align-items: center !important; justify-content: space-around !important; padding: 12px 24px !important; border-radius: 999px !important; background: rgba(255, 255, 255, 0.15) !important; backdrop-filter: blur(24px) saturate(180%) !important; -webkit-backdrop-filter: blur(24px) saturate(180%) !important; border: 1px solid rgba(255, 255, 255, 0.4) !important; box-shadow: 0 4px 24px rgba(0, 0, 0, 0.04), inset 0 1px 0 rgba(255, 255, 255, 0.8) !important; z-index: 1000 !important; box-sizing: border-box !important; margin: 0 !important; background-color: rgba(255, 255, 255, 0.15) !important;";
        nav.style.cssText += glassStyle;
        document.body.style.paddingBottom = "100px"; // 留出底部空间防止内容被遮挡
    }
});
</script>

</body>
</html>
