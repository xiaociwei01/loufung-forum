<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LouFung 论坛</title>
<link rel="stylesheet" href="/style.css?v=121">
<script>
(function(){
  var t = localStorage.getItem('forum-theme') || 'light';
  document.documentElement.setAttribute('data-theme', t);
})();
</script>
</head>
<body>
<div class="hero-orb"></div>
<div class="hero-orb-2"></div>

<nav class="nav">
  <a href="/" class="brand">LouFung 论坛</a>
  <span id="nav-right"></span>
</nav>

<div class="container">
  <div style="display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:24px;gap:16px">
    <div>
      <h1>讨论区</h1>
      <p class="sub" style="margin:0">随便聊聊</p>
    </div>
    <button class="btn small" id="newBtn" style="display:none" onclick="location.href='/new.html'">发帖</button>
  </div>
  <div id="posts"></div>
</div>
<script>
function toggleTheme() {
  const cur = document.documentElement.getAttribute('data-theme') || 'light';
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('forum-theme', next);
  document.getElementById('themeBtn').textContent = next === 'dark' ? '☀️' : '🌙';
}
function esc(s) {
  return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}

let me_user = null;
let meUser = null;

async function init() {
  const me = await fetch('/api/me').then(r => r.json()).catch(() => ({ user: null }));
  const nav = document.getElementById('nav-right');
  me_user = me.user;
  meUser = me.user;
  if (me.user) {
    nav.innerHTML = '<span style="font-size:13px;color:var(--text-muted)">' + esc(me.user.username) + '</span> <a href="#" onclick="logout();return false" style="margin-left:12px">退出</a>';
    document.getElementById('newBtn').style.display = 'block';
  } else {
    nav.innerHTML = '<a href="/login.html">登录</a><a href="/register.html" style="margin-left:12px">注册</a>';
  }
  loadPosts();
}

function avatarHTML(name) {
  const colors = ['#4d6bfe','#f59e0b','#10b981','#ef4444','#8b5cf6','#ec4899','#06b6d4','#84cc16'];
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) >>> 0;
  const color = colors[h % colors.length];
  const letter = (name[0] || '?').toUpperCase();
  return '<div class="avatar" style="background:' + color + '">' + letter + '</div>';
}

async function loadPosts() {
  const box = document.getElementById('posts');
  try {
    const r = await fetch('/api/posts');
    const d = await r.json();
    if (!d.posts || d.posts.length === 0) {
      box.innerHTML = '<div class="card" style="text-align:center;color:var(--text-muted)">还没有帖子，来发第一篇吧</div>';
      return;
    }
    box.innerHTML = d.posts.map(p => {
      const excerpt = (p.content || '').slice(0, 80) + ((p.content || '').length > 80 ? '…' : '');
      return `
        <div class="card" style="margin-bottom:16px">
          <div class="post-head">
            <div class="author-row">
              ${avatarHTML(p.username)}
              <span class="author-name">${esc(p.username)}</span>
              <span class="author-time">${p.created_at}</span>
              ${meUser && meUser.username === p.username ? `<span onclick="event.stopPropagation();event.preventDefault();deleteCard(${p.id})" style="font-size:12px;color:var(--text-muted);cursor:pointer;margin-left:10px">删除</span>` : ''}
            </div>
            <a href="/post.html?id=${p.id}" style="text-decoration:none;color:inherit">
              <h2 class="post-title">${esc(p.title)}</h2>
            </a>
            <div class="post-excerpt">${esc(excerpt)}</div>
            <div class="post-actions">
              <span class="act" onclick="event.stopPropagation();likeCard(${p.id},this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M7 10v12"/><path d="M15 5.88 14 10h5.83a2 2 0 0 1 1.92 2.56l-2.33 8A2 2 0 0 1 17.5 22H4a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h2.76a2 2 0 0 0 1.79-1.11L12 2a3.13 3.13 0 0 1 3 3.88Z"/></svg><span>${p.like_count || 0}</span></span>
              <span class="act" onclick="event.stopPropagation();location.href='/post.html?id=${p.id}'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg><span>${p.comment_count || 0}</span></span>
              <span class="act" onclick="event.stopPropagation();shareCard(${p.id},this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg><span>${p.share_count || 0}</span></span>
            </div>
          </div>
        </div>
      `;
    }).join('');
  } catch (e) {
    box.innerHTML = '<div class="card">加载失败</div>';
  }
}

function likeCard(id, el) {
  if (!meUser) { location.href = '/login.html'; return; }
  fetch('/api/posts/' + id + '/like', { method: 'POST' })
    .then(r => r.json())
    .then(d => {
      if (d.ok) {
        const numEl = el.querySelector('span');
        const cur = parseInt(numEl.textContent) || 0;
        numEl.textContent = d.liked ? cur + 1 : Math.max(0, cur - 1);
        el.style.color = d.liked ? 'var(--accent)' : '';
      }
    }).catch(() => {});
}

function shareCard(id, el) {
  const url = 'https://forum.loufung.cn/post.html?id=' + id;
  if (meUser) {
    fetch('/api/posts/' + id + '/share', { method: 'POST' })
      .then(r => r.json())
      .then(d => {
        if (d.ok && !d.already) {
          el.querySelector('span').textContent = d.share_count;
        }
      }).catch(() => {});
  }
  if (navigator.share) {
    navigator.share({ title: 'LouFung 论坛', url: url }).catch(() => {});
  } else {
    navigator.clipboard.writeText(url).then(() => alert('链接已复制'));
  }
}

function deleteCard(id) {
  if (!confirm('确定删除这篇帖子？删了恢复不了')) return;
  fetch('/api/posts/' + id, { method: 'DELETE' })
    .then(r => r.json())
    .then(d => {
      if (d.ok) { loadPosts(); }
      else { alert(d.error || '删除失败'); }
    }).catch(() => alert('网络错误'));
}

async function logout() {
  await fetch('/api/logout', { method: 'POST' });
  location.reload();
}

function fallbackCopy(text) {
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(() => alert('链接已复制')).catch(() => prompt('复制链接：', text));
  } else {
    prompt('复制链接：', text);
  }
}

async function togglePostLikeIndex(pid, el) {
  if (!me_user) { location.href = '/login.html'; return; }
  try {
    const r = await fetch('/api/posts/' + pid + '/like', { method: 'POST' });
    const d = await r.json();
    if (d.ok) {
      const num = el.querySelector('span:last-child');
      const cur = parseInt(num.textContent) || 0;
      num.textContent = d.liked ? cur + 1 : Math.max(0, cur - 1);
      el.style.color = d.liked ? 'var(--accent)' : '';
    }
  } catch (e) {}
}


init();
</script>
</body>
</html>
