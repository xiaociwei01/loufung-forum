<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta name="view-transition" content="same-origin" />
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LouFung 论坛</title>
<link rel="stylesheet" href="/style.css?v=134">
<script>
(function(){
  var t = localStorage.getItem('forum-theme') || 'light';
  document.documentElement.setAttribute('data-theme', t);
})();
</script>

<style>body { padding-top: 105px !important; }</style>
</head>
<body>
<div class="hero-orb"></div>
<div class="hero-orb-2"></div>

<header class="forum-header" style="position: fixed !important; top: 16px !important; left: 50% !important; transform: translateX(-50%) !important; width: calc(100% - 32px) !important; max-width: 880px !important; display: flex !important; flex-direction: row !important; align-items: center !important; justify-content: space-between !important; padding: 12px 24px !important; border-radius: 999px !important; background: rgba(255, 255, 255, 0.15) !important; backdrop-filter: blur(24px) saturate(180%) !important; -webkit-backdrop-filter: blur(24px) saturate(180%) !important; border: 1px solid rgba(255, 255, 255, 0.4) !important; box-shadow: 0 4px 24px rgba(0, 0, 0, 0.04), inset 0 1px 0 rgba(255, 255, 255, 0.8) !important; z-index: 1000 !important; box-sizing: border-box !important; margin: 0 !important;">
  
  <a href="/" class="logo" style="font-size: 15px !important; font-weight: 600 !important; color: #0a0a0a !important; text-decoration: none !important; text-shadow: 0 0 2px #fff, 0 0 6px #fff !important;">
     Lou<span style="color: #4d6bfe !important;">Fung</span> 论坛
  </a>

  <!-- 只留这一个空 div，让 JS 自己往里塞搜索和头像 -->
  <div id="nav-right" style="display: flex !important; align-items: center !important; gap: 12px !important;"></div>
</header>

<div class="container">
  <div style="display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:24px;gap:16px">
    <div>
      <h1>回响</h1>
      <p class="sub" style="margin:0">随意记录，慢慢生长</p>
    </div>
    
  </div>
  <div id="posts"></div>
</div>
<script>
function toggleTheme() {
  const cur = document.documentElement.getAttribute('data-theme') || 'light';
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('forum-theme', next);
  document.getElementById('themeBtn').textContent = next === 'dark' ? '☀️' : '🌙';
}
function esc(s) {
  return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}

let me_user = null;
let meUser = null;


function esc(s) {
  return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}

function avatarHTML(name) {
  const colors = ['#4d6bfe','#f59e0b','#10b981','#ef4444','#8b5cf6','#ec4899','#06b6d4','#84cc16'];
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) >>> 0;
  return '<div class="avatar" style="background:' + colors[h % colors.length] + '">' + (name[0] || '?').toUpperCase() + '</div>';
}

async function init() {
  const me = await fetch('/api/me').then(r => r.json()).catch(() => ({ user: null }));
  meUser = me.user;
  const nav = document.getElementById('nav-right');
  const searchBtn = '<a href="/search.html" class="nav-icon-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></a>';
  
  if (me.user) {
    let h = 0;
  for (let i = 0; i < me.user.username.length; i++) h = (h * 31 + me.user.username.charCodeAt(i)) >>> 0;
  const colors = ['#4d6bfe','#f59e0b','#10b981','#ef4444','#8b5cf6','#ec4899','#06b6d4','#84cc16'];
  const navBg = colors[h % colors.length];
  nav.innerHTML = searchBtn + '<a href="/user.html?u=' + encodeURIComponent(me.user.username) + '" class="nav-avatar" style="text-decoration:none;background:' + navBg + '">' + esc(me.user.username[0]).toUpperCase() + '</a>';
  } else {
    nav.innerHTML = searchBtn + '<a href="/login.html" style="font-size:14px;color:var(--accent);text-decoration:none;font-weight:500;margin-left:4px;">登录</a>';
  }
  
  loadPosts();
}

async function loadPosts() {
  const box = document.getElementById('posts');
  try {
    const r = await fetch('/api/posts');
    const d = await r.json();
    if (!d.posts || d.posts.length === 0) {
      box.innerHTML = '<div class="card" style="text-align:center;color:var(--text-muted)">还没有帖子，来发第一篇吧</div>';
      return;
    }
    box.innerHTML = d.posts.map(p => {
      const excerpt = (p.content || '').slice(0, 80) + ((p.content || '').length > 80 ? '…' : '');
      return `
        <div class="card reveal" style="margin-bottom:16px">
          <div class="post-head">
            <div class="author-row">
              ${avatarHTML(p.username)}
              <a href="/user.html?u=${encodeURIComponent(p.username)}" class="author-name" style="text-decoration:none">${esc(p.username)}</a>
              <span class="author-time">${p.created_at}</span>
              ${meUser && meUser.username === p.username ? `<span onclick="event.stopPropagation();event.preventDefault();deleteCard(${p.id})" style="font-size:12px;color:var(--text-muted);cursor:pointer;margin-left:10px">删除</span>` : ''}
            </div>
            <a href="/post.html?id=${p.id}" style="text-decoration:none;color:inherit">
              <h2 class="post-title">${esc(p.title)}</h2>
            </a>
            <div class="post-excerpt">${esc(excerpt)}</div>
            <div class="post-actions">
              <span class="act" onclick="event.stopPropagation();likeCard(${p.id},this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M7 10v12"/><path d="M15 5.88 14 10h5.83a2 2 0 0 1 1.92 2.56l-2.33 8A2 2 0 0 1 17.5 22H4a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h2.76a2 2 0 0 0 1.79-1.11L12 2a3.13 3.13 0 0 1 3 3.88Z"/></svg><span>${p.like_count || 0}</span></span>
              <span class="act" onclick="event.stopPropagation();location.href='/post.html?id=${p.id}'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg><span>${p.comment_count || 0}</span></span>
              <span class="act" onclick="event.stopPropagation();shareCard(${p.id},this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg><span>${p.share_count || 0}</span></span>
            </div>
          </div>
        </div>
      `;
    }).join('');
    if (window.initReveal) window.initReveal();
  } catch (e) {
    box.innerHTML = '<div class="card">加载失败</div>';
  }
}

function likeCard(id, el) {
  if (!meUser) { location.href = '/login.html'; return; }
  fetch('/api/posts/' + id + '/like', { method: 'POST' })
    .then(r => r.json())
    .then(d => {
      if (d.ok) {
        const numEl = el.querySelector('span');
        const cur = parseInt(numEl.textContent) || 0;
        numEl.textContent = d.liked ? cur + 1 : Math.max(0, cur - 1);
        el.style.color = d.liked ? 'var(--accent)' : '';
      }
    }).catch(() => {});
}

function shareCard(id, el) {
  const url = 'https://forum.loufung.cn/post.html?id=' + id;
  if (meUser) {
    fetch('/api/posts/' + id + '/share', { method: 'POST' })
      .then(r => r.json())
      .then(d => {
        if (d.ok && !d.already) {
          el.querySelector('span').textContent = d.share_count;
        }
      }).catch(() => {});
  }
  if (navigator.share) {
    navigator.share({ title: 'LouFung 论坛', url: url }).catch(() => {});
  } else {
    navigator.clipboard.writeText(url).then(() => alert('链接已复制'));
  }
}

function deleteCard(id) {
  if (!confirm('确定删除这篇帖子？删了恢复不了')) return;
  fetch('/api/posts/' + id, { method: 'DELETE' })
    .then(r => r.json())
    .then(d => {
      if (d.ok) { loadPosts(); }
      else { alert(d.error || '删除失败'); }
    }).catch(() => alert('网络错误'));
}

async function logout() {
  await fetch('/api/logout', { method: 'POST' });
  location.reload();
}

function fallbackCopy(text) {
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(() => alert('链接已复制')).catch(() => prompt('复制链接：', text));
  } else {
    prompt('复制链接：', text);
  }
}

async function togglePostLikeIndex(pid, el) {
  if (!me_user) { location.href = '/login.html'; return; }
  try {
    const r = await fetch('/api/posts/' + pid + '/like', { method: 'POST' });
    const d = await r.json();
    if (d.ok) {
      const num = el.querySelector('span:last-child');
      const cur = parseInt(num.textContent) || 0;
      num.textContent = d.liked ? cur + 1 : Math.max(0, cur - 1);
      el.style.color = d.liked ? 'var(--accent)' : '';
    }
  } catch (e) {}
}


init();
</script>

<div class="global-nav">
  <a href="/" class="active">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    首页
  </a>
  <a href="/new.html" class=" add-btn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    发帖
  </a>
  <a href="/my" class="">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    我的
  </a>
</div>


<script>
// 动态修复底栏的“我的”链接
(async function() {
  try {
    const r = await fetch('/api/me');
    const d = await r.json();
    const myLink = document.querySelector('.global-nav a[href="/my"]');
    if (myLink) {
      if (d.user) {
        myLink.href = '/user.html?u=' + encodeURIComponent(d.user.username);
        myLink.classList.add('active'); // 如果在用户主页可以高亮
      } else {
        myLink.href = '/login.html';
      }
    }
  } catch(e) {}
})();
</script>

<script src="/animations.js"></script>

<script id="glass-bottom-nav-script">
document.addEventListener("DOMContentLoaded", function() {
    const addBtn = document.querySelector('a[href="/new.html"].add-btn');
    if(addBtn && addBtn.parentElement) {
        const nav = addBtn.parentElement;
        const glassStyle = "position: fixed !important; bottom: 16px !important; left: 50% !important; transform: translateX(-50%) !important; width: calc(100% - 32px) !important; max-width: 880px !important; display: flex !important; flex-direction: row !important; align-items: center !important; justify-content: space-around !important; padding: 12px 24px !important; border-radius: 999px !important; background: rgba(255, 255, 255, 0.15) !important; backdrop-filter: blur(24px) saturate(180%) !important; -webkit-backdrop-filter: blur(24px) saturate(180%) !important; border: 1px solid rgba(255, 255, 255, 0.4) !important; box-shadow: 0 4px 24px rgba(0, 0, 0, 0.04), inset 0 1px 0 rgba(255, 255, 255, 0.8) !important; z-index: 1000 !important; box-sizing: border-box !important; margin: 0 !important; background-color: rgba(255, 255, 255, 0.15) !important;";
        nav.style.cssText += glassStyle;
        document.body.style.paddingBottom = "100px"; // 留出底部空间防止内容被遮挡
    }
});
</script>

</body>
</html>
