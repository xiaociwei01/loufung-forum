<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LouFung 论坛</title>
<link rel="stylesheet" href="/style.css?v=2">
<script>
(function(){
  var t = localStorage.getItem('forum-theme') || 'light';
  document.documentElement.setAttribute('data-theme', t);
})();
</script>
</head>
<body>
<div class="scroll-progress" id="scrollProgress"></div>
<div class="hero-orb"></div>
<div class="hero-orb-2"></div>

<nav class="nav">
  <a href="/" class="brand">LouFung 论坛</a>
  <span id="nav-right"></span>
  <button class="theme-btn" id="themeBtn" onclick="toggleTheme()" aria-label="切换主题">🌙</button>
</nav>

<div class="container">
  <div style="display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:24px;gap:16px">
    <div>
      <h1>讨论区</h1>
      <p class="sub" style="margin:0">随便聊聊</p>
    </div>
    <button class="btn small" id="newBtn" style="display:none" onclick="location.href='/new.html'">发帖</button>
  </div>
  <div id="posts"></div>
</div>
<script>
function toggleTheme() {
  const cur = document.documentElement.getAttribute('data-theme') || 'light';
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('forum-theme', next);
  document.getElementById('themeBtn').textContent = next === 'dark' ? '☀️' : '🌙';
}
(function(){
  const t = document.documentElement.getAttribute('data-theme');
  document.getElementById('themeBtn').textContent = t === 'dark' ? '☀️' : '🌙';
})();

window.addEventListener('scroll', () => {
  const h = document.documentElement.scrollHeight - window.innerHeight;
  const p = h > 0 ? (window.scrollY / h) * 100 : 0;
  document.getElementById('scrollProgress').style.width = p + '%';
}, { passive: true });

function esc(s) {
  return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}

async function init() {
  const me = await fetch('/api/me').then(r => r.json()).catch(() => ({ user: null }));
  const nav = document.getElementById('nav-right');
  if (me.user) {
    nav.innerHTML = '<span style="font-size:13px;color:var(--text-muted)">' + esc(me.user.username) + '</span> <a href="#" onclick="logout();return false" style="margin-left:12px">退出</a>';
    document.getElementById('newBtn').style.display = 'block';
  } else {
    nav.innerHTML = '<a href="/login.html">登录</a><a href="/register.html" style="margin-left:12px">注册</a>';
  }
  loadPosts();
}

async function loadPosts() {
  const box = document.getElementById('posts');
  try {
    const r = await fetch('/api/posts');
    const d = await r.json();
    if (!d.posts || d.posts.length === 0) {
      box.innerHTML = '<div class="card" style="text-align:center;color:var(--text-muted)">还没有帖子，来发第一篇吧</div>';
      return;
    }
    box.innerHTML = d.posts.map(p =>
      '<div class="card" style="margin-bottom:16px">' +
        '<a href="/post.html?id=' + p.id + '" style="text-decoration:none;color:inherit">' +
          '<h2>' + esc(p.title) + '</h2>' +
        '</a>' +
        '<div class="meta" style="margin-top:6px">' + esc(p.username) + ' · ' + p.created_at + '</div>' +
      '</div>'
    ).join('');
  } catch (e) {
    box.innerHTML = '<div class="card">加载失败</div>';
  }
}

async function logout() {
  await fetch('/api/logout', { method: 'POST' });
  location.reload();
}

init();
</script>
</body>
</html>
